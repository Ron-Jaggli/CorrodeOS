[workspace]
resolver = "2"
members = [
    "kernel",
    "render",
    "text",
    "gfx",
    "pci",
    "abi",
    "elf",
    "virtio",
    "nv",
    "user/rt",
    "user/edu",
    "user/fault",
    "user/virtio-gpu",
    "user/blob-reader",
    "user/nvidia",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MPL-2.0"

# Size and determinism matter more than compile time for a kernel image.
[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 2
debug = true

[profile.dev]
panic = "abort"
opt-level = 1
debug = true
