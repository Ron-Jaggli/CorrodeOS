[package]
name = "corrode-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "corrode"
path = "src/main.rs"
test = false
bench = false

[dependencies]
corrode-render = { path = "../render", features = ["alloc"] }
corrode-theme = { path = "../theme" }
corrode-seal = { path = "../seal" }
corrode-heap = { path = "../heap" }
corrode-text = { path = "../text" }
corrode-pci = { path = "../pci" }
corrode-abi = { path = "../abi" }
corrode-elf = { path = "../elf" }
corrode-vault = { path = "../vault" }
corrode-pe = { path = "../pe" }
corrode-shell = { path = "../shell" }

[features]
# Deliberately take a page fault at the end of boot to exercise the trap
# reporting path. Ends the boot, so it is never on by default.
fault-test = []

# Write to .text after paging is up; must page-fault if W^X actually holds.
wx-test = []

# Overflow a task stack; must fault on the guard page rather than corrupt
# whatever is mapped below.
stack-test = []

# Put a ring 3 task in front of a kernel address; the missing USER bit must
# turn the read into a page fault.
user-test = []

# For booting on a real machine with no serial cable: mirror the boot log onto
# the firmware's framebuffer, and stop after the NVIDIA stage so nothing paints
# over it. See `screen_log` and `scripts/flash-usb.sh`. Implies `efi-log`, for a
# machine whose screen stays dark.
hw-log = ["efi-log"]

# Keep the boot log in UEFI variables, readable from Linux after a reboot under
# /sys/firmware/efi/efivars/CorrodeLog*. See `efi_log`.
efi-log = []
