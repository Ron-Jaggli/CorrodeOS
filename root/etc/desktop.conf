# CorrodeOS desktop
#
# Change anything below, then rebuild with ./corrode iso -- or change it while
# the desktop runs, in Settings. One setting a line; # starts a comment. A
# line that does not make sense is skipped, so a typo cannot break the desktop.

# Where to start from. Every other line here changes the preset.
#   corrode      dark glass, rust accent, traffic lights on the left (default)
#   tahoe        macOS-blue accent and a cool aurora wallpaper
#   tahoe-light  the same, light
#   breeze       Plasma: blue accent, buttons on the right, ribbon wallpaper
#   crystal      Clear glass that bends hard, over dunes
#   plain        no glass, no shadows, no animation -- the cheapest to draw
preset = corrode

# dark | light
appearance = dark

# Any #rrggbb.
accent = #e2643a

# What panels, the dock and title bars are made of.
#   regular  frosted, so text on it stays legible
#   clear    sees straight through, bent at the edges
#   off      solid
glass = regular

# How far the edge of the glass bends what is behind it, 0 to 120.
refraction = 60

# How frosted Regular glass is, in percent: 100 is the usual, 0 is none.
frost = 100

# Colour every pane: none, or #rrggbb (with tint_amount 0 to 255).
tint = none

# Window corners, in pixels.
corner_radius = 12

# Window buttons: left (macOS) or right (Plasma).
buttons = left

# aurora | ribbons | dunes | gradient, and up to three colours for it.
wallpaper = aurora
wallpaper_colors = #2a1b4a #d95a2b #1d6f8c

# The dock along the bottom: on | off, icon size in pixels, whether an
# icon jumps when it starts something, and how big an icon grows under the
# pointer (on | off, or 100-200 percent).
dock = on
dock_size = 48
bounce = on
magnify = on

shadows = on

# Animation speed in percent: 100 normal, 200 twice as fast, 0 none.
animation_speed = 100

# The menu bar clock. The machine's clock is read as UTC: say how far your
# timezone is from it, as UTC, +5, -8 or +05:30.
timezone = UTC

# 24h | 12h
clock = 24h

# A passcode for the lock screen (Alt+L): 4 to 8 digits. Without one,
# Return unlocks. `./corrode passcode-hash` rewrites it here as a salted
# hash, so this file no longer shows it. 4 to 8 digits can still be
# guessed from the hash, so it keeps a passer-by out, not someone with
# the disk.
# passcode = 2468
